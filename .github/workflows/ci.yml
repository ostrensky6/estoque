name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Reconstruir o banco local a partir das migrations
        run: |
          supabase start
          supabase db reset --no-seed

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir base do versionamento
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "::error::SHA base ausente ou all-zero; versionamento nao pode ser comprovado."
            exit 1
          fi
          echo "APP_VERSION_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validar incremento da versao
        run: |
          npm run version:test
          npm run version:check -- "$APP_VERSION_BASE_REF"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Validar tipo, lint, testes, build e E2E
        run: npm run verify
        env:
          # o webServer do Playwright sobe `npm run dev` com mock do Supabase;
          # estes valores são fictícios e nunca tocam o banco real.
          PLAYWRIGHT_MOCK_SUPABASE: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # valores fictícios — as páginas são dinâmicas e não acessam o banco no build
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
